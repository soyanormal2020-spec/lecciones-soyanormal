.crt { position:fixed; inset:0; pointer-events:none; z-index:998;

/* ── HEADER ── */
header {
  position:relative; z-index:10;

  margin-bottom:10px; line-height:1.5;
}
.subtitle { font-size:7px; color:#888; letter-spacing:1px; }
@keyframes glitch {
  0%,88%,100%{transform:translate(0)}
  90%{transform:translate(-2px,1px)} 92%{transform:translate(2px,-1px)} 94%{transform:translate(0)}
}
@keyframes glow-gold {
  from{filter:drop-shadow(0 0 4px var(--gold))} to{filter:drop-shadow(0 0 16px var(--gold))}
}

/* ── WHEEL CONTAINER ── */
.wheel-wrap {
  position:relative; z-index:10;
  width:min(90vw, 600px); height:min(90vw, 600px);
  margin:20px auto 10px;
  flex-shrink:0;
}
.wheel-wrap svg { width:100%; height:100%; overflow:visible; }

/* sector interaction */
.sector {
  cursor:pointer;
  transition:filter .2s;
}
.sector:hover .sector-fill { filter:brightness(1.35); }
.sector.active .sector-fill { filter:brightness(1.5); }

/* number labels */
.house-num-text {
  font-family:'Press Start 2P', cursive;
  font-size:14px;
  font-weight:bold;
  pointer-events:none;
  text-anchor:middle;
  dominant-baseline:middle;
}

/* center circle */
.center-circle { pointer-events:none; }

/* ── LEGEND ROW ── */
.legend {
  position:relative; z-index:10;
  display:flex; gap:14px; flex-wrap:wrap; justify-content:center;
  padding:8px 20px 0;
}
.legend-item {
  display:flex; align-items:center; gap:6px;
  font-size:6px; color:#aaa;
}
.legend-dot { width:10px; height:10px; border:2px solid; flex-shrink:0; }

/* ── MODAL ── */
.modal-overlay {

.modal-overlay.active { opacity:1; pointer-events:all; }

/* ═══════════════════════════════════════════════
   WHEEL BUILDER
═══════════════════════════════════════════════ */
const SVG_NS = 'http://www.w3.org/2000/svg';
const OUTER_R = 290;
const INNER_R = 64;   // matches center circle r=56 + padding
const NUM_R   = 88;   // radius for house numbers
const TOTAL   = 12;
const STEP    = (2 * Math.PI) / TOTAL;
// Start at top (12 o'clock position) and go clockwise
// Traditional wheel: house 1 starts at the left (9 o'clock = 180°) and goes counter-clockwise
// We'll place house 1 at left-center (Ascendant position) going counter-clockwise
// angle offset: house 1 = 180° (left side), counter-clockwise
const OFFSET  = Math.PI; // start angle for house 1

function polarToXY(angle, r) {
  return { x: r * Math.cos(angle), y: r * Math.sin(angle) };
}

function sectorPath(startAngle, endAngle, innerR, outerR) {
  const s1 = polarToXY(startAngle, outerR);
  const s2 = polarToXY(endAngle, outerR);
  const s3 = polarToXY(endAngle, innerR);
  const s4 = polarToXY(startAngle, innerR);
  const largeArc = (endAngle - startAngle) > Math.PI ? 1 : 0;
  return [
    `M ${s1.x} ${s1.y}`,
    `A ${outerR} ${outerR} 0 ${largeArc} 1 ${s2.x} ${s2.y}`,
    `L ${s3.x} ${s3.y}`,
    `A ${innerR} ${innerR} 0 ${largeArc} 0 ${s4.x} ${s4.y}`,
    'Z'
  ].join(' ');
}

function buildWheel() {
  const sg = document.getElementById('sectorsGroup');
  const lg = document.getElementById('labelsGroup');

  houses.forEach((h, i) => {
    const c = COLORS[h.elemento];
    // Counter-clockwise: each house goes from OFFSET - i*STEP to OFFSET - (i+1)*STEP
    const startAngle = OFFSET - i * STEP;
    const endAngle   = OFFSET - (i + 1) * STEP;
    const midAngle   = (startAngle + endAngle) / 2;

    // --- Sector group ---
    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('class', 'sector');
    g.dataset.idx = i;

    // Sector fill
    const path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('d', sectorPath(startAngle, endAngle, INNER_R, OUTER_R));
    path.setAttribute('class', 'sector-fill');
    path.setAttribute('fill', c.dimAlpha.replace('rgba','rgb').replace(/,[^,)]+\)/,')')); // solid dim base
    path.setAttribute('fill', c.dim);
    path.setAttribute('stroke', '#0A0A1B');
    path.setAttribute('stroke-width', '3');
    // Add pixel overlay
    path.setAttribute('fill-opacity', '1');
    g.appendChild(path);

    // Sector glow overlay
    const pathGlow = document.createElementNS(SVG_NS, 'path');
    pathGlow.setAttribute('d', sectorPath(startAngle, endAngle, INNER_R, OUTER_R));
    pathGlow.setAttribute('fill', c.main);
    pathGlow.setAttribute('opacity', '0.12');
    pathGlow.setAttribute('class', 'sector-glow');
    pathGlow.style.transition = 'opacity .2s';
    g.appendChild(pathGlow);

    // Sector border accent line (outer edge highlight)
    const arcStart = polarToXY(startAngle, OUTER_R - 4);
    const arcEnd   = polarToXY(endAngle, OUTER_R - 4);
    const accentArc = document.createElementNS(SVG_NS, 'path');
    accentArc.setAttribute('d',
      `M ${arcStart.x} ${arcStart.y} A ${OUTER_R-4} ${OUTER_R-4} 0 0 1 ${arcEnd.x} ${arcEnd.y}`);
    accentArc.setAttribute('stroke', c.main);
    accentArc.setAttribute('stroke-width', '3');
    accentArc.setAttribute('fill', 'none');
    accentArc.setAttribute('opacity', '0.6');
    g.appendChild(accentArc);

    // House number
    const numPos = polarToXY(midAngle, NUM_R);
    const numText = document.createElementNS(SVG_NS, 'text');
    numText.setAttribute('x', numPos.x);
    numText.setAttribute('y', numPos.y);
    numText.setAttribute('class', 'house-num-text');
    numText.setAttribute('fill', c.glow);
    numText.setAttribute('font-size', '15');
    numText.textContent = h.n;
    numText.style.filter = `drop-shadow(0 0 4px ${c.main})`;
    g.appendChild(numText);

    // Emoji at middle radius
    const emojiPos = polarToXY(midAngle, 180);
    const emojiText = document.createElementNS(SVG_NS, 'text');
    emojiText.setAttribute('x', emojiPos.x);
    emojiText.setAttribute('y', emojiPos.y);
    emojiText.setAttribute('text-anchor', 'middle');
    emojiText.setAttribute('dominant-baseline', 'middle');
    emojiText.setAttribute('font-size', '16');
    emojiText.setAttribute('fill', c.main);
    emojiText.setAttribute('opacity', '0.7');
    emojiText.style.pointerEvents = 'none';
    emojiText.textContent = h.emoji;
    g.appendChild(emojiText);

    // Click handler
    g.addEventListener('click', () => openModal(i));
    g.addEventListener('mouseenter', () => {
      pathGlow.setAttribute('opacity', '0.28');
    });
    g.addEventListener('mouseleave', () => {
      pathGlow.setAttribute('opacity', '0.12');
    });

    sg.appendChild(g);
  });

  // Divider lines
  for (let i = 0; i < TOTAL; i++) {
    const angle = OFFSET - i * STEP;
    const p1 = polarToXY(angle, INNER_R);
    const p2 = polarToXY(angle, OUTER_R);
    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
    line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
    line.setAttribute('stroke', '#0A0A1B');
    line.setAttribute('stroke-width', '3');
    line.style.pointerEvents = 'none';
    sg.appendChild(line);
  }
}

buildWheel();

    <div class="info-grid">

        <div class="info-val" style="color:${c.glow}">${h.signo}</div>
      </div>
      <div class="info-cell" style="border-color:${c.main}55;background:${c.dim};">
        <div class="info-label">REGENTE</div>
        <div class="info-val" style="color:${c.glow}">${h.regente}</div>

        <div class="kw-tag" style="color:${c.glow};border-color:${c.main}66;background:${c.dim};">
          ${k}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow = '';
}
document.getElementById('closeBtn').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', e => { if(e.target.id==='modal') closeModal(); });

/* ═══════════════════════════════════════════════
   8-BIT SOUND
═══════════════════════════════════════════════ */
let audioCtx;
function play8bit(elemento) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const melodies = {
      FUEGO: [523,659,784,1047], TIERRA:[392,494,587,740],
      AIRE:  [659,784,988,1175], AGUA:  [440,554,659,880],
    };
    const waves = { FUEGO:'square', TIERRA:'sawtooth', AIRE:'triangle', AGUA:'sine' };
    (melodies[elemento]||melodies.FUEGO).forEach((freq,i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = waves[elemento]||'square';
      osc.frequency.value = freq;
      const t = audioCtx.currentTime + i * 0.1;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.07, t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t+0.18);
      osc.start(t); osc.stop(t+0.2);
    });
  } catch(e){}
}

/* ═══════════════════════════════════════════════
   BACKGROUND CANVAS
═══════════════════════════════════════════════ */
const bgC = document.getElementById('bgCanvas');
const bgX = bgC.getContext('2d');
let W,H;
function resz(){ W=bgC.width=window.innerWidth; H=bgC.height=window.innerHeight; }
resz(); window.addEventListener('resize', resz);

const stars = Array.from({length:180}, ()=>({
  x:Math.random()*3000, y:Math.random()*3000,
  sz:Math.random()*2.5+.5, b:Math.random(), sp:Math.random()*.012+.004,
  col:['#fff','#F7B801','#00D9FF','#FF3D81','#724CF9','#39FF88','#FF4E0C'][Math.floor(Math.random()*7)],
}));
const meteors=[];
function spawnM(){
  meteors.push({
    x:Math.random()*W,y:-20,
    vx:(Math.random()*4+2)*(Math.random()<.5?1:-1),vy:Math.random()*4+3,
    life:0,max:Math.random()*70+30,
    col:['#F7B801','#00D9FF','#fff','#FF8C42','#39FF88','#B088FF'][Math.floor(Math.random()*6)],
  });
}
let fr=0;
function animBg(){
  requestAnimationFrame(animBg); fr++;
  bgX.clearRect(0,0,W,H);
  [[.15,.2,260,'rgba(255,78,12,.05)'],[.85,.7,300,'rgba(57,255,136,.04)'],
   [.5,.4,220,'rgba(0,217,255,.04)'],[.3,.8,200,'rgba(114,76,249,.05)']].forEach(([fx,fy,r,c])=>{
    const g=bgX.createRadialGradient(fx*W,fy*H,0,fx*W,fy*H,r);
    g.addColorStop(0,c);g.addColorStop(1,'transparent');
    bgX.fillStyle=g;bgX.fillRect(0,0,W,H);
  });
  stars.forEach(s=>{
    s.b+=s.sp; bgX.globalAlpha=.1+Math.abs(Math.sin(s.b))*.9;
    bgX.fillStyle=s.col;
    bgX.fillRect(Math.round(s.x%W),Math.round(s.y%H),Math.ceil(s.sz),Math.ceil(s.sz));
  });
  bgX.globalAlpha=1;
  if(fr%100===0&&Math.random()<.7) spawnM();
  for(let i=meteors.length-1;i>=0;i--){
    const m=meteors[i]; m.x+=m.vx; m.y+=m.vy; m.life++;
    const al=m.life<10?m.life/10:m.life>m.max-10?(m.max-m.life)/10:1;
    bgX.globalAlpha=al*.85; bgX.strokeStyle=m.col; bgX.lineWidth=1.5;
    bgX.shadowBlur=7; bgX.shadowColor=m.col;
    bgX.beginPath(); bgX.moveTo(m.x,m.y); bgX.lineTo(m.x-m.vx*10,m.y-m.vy*10); bgX.stroke();
    bgX.shadowBlur=0; bgX.globalAlpha=1;
    if(m.life>=m.max||m.y>H+20) meteors.splice(i,1);
  }
}
animBg();
